<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Đoán Chữ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đoán Chữ">
<meta name="theme-color" content="#b3122b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#b3122b; --bg2:#8e0d21; --ink:#fff; --muted:rgba(255,255,255,.75);
  --gold:#ffd23f; --ok:#16a34a; --skip:#f59e0b; --card:rgba(255,255,255,.12);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.screen.on{display:flex}

/* Start */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{font-size:32px;font-weight:900;letter-spacing:.5px}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:15px;margin-bottom:14px;line-height:1.35}
.pills{display:flex;gap:8px}
.pill.sel{background:var(--gold);color:#3a1a00}
.pill{color:inherit;text-decoration:none;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.row label{color:var(--muted);font-size:14px;margin-right:4px}
.seg{background:var(--card);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px}
.seg.sel{background:var(--gold);color:#3a1a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:20px}
.cat{background:var(--card);border-radius:16px;padding:16px 12px;text-align:left;min-height:86px;
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .1s}
.cat:active{transform:scale(.96)}
.cat b{font-size:17px;line-height:1.2}
.cat i{font-style:normal;font-size:26px}
.cat small{color:var(--muted);font-size:12px}
.how{background:rgba(0,0,0,.18);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:14px}
.how b{color:var(--ink)}

/* Countdown / play */
#ready,#play{align-items:center;justify-content:center;text-align:center}
#ready .big{font-size:clamp(90px,30vmin,220px);font-weight:900;color:var(--gold);line-height:1}
#ready .msg{font-size:clamp(22px,6vmin,40px);font-weight:700;margin-bottom:10px}
#ready .hint{color:var(--muted);font-size:clamp(14px,3.6vmin,20px);margin-top:14px;max-width:34em;line-height:1.4}
#play{transition:background .15s}
#play.ok{background:var(--ok)}
#play.skip{background:var(--skip)}
#word{font-weight:900;line-height:1.05;max-width:94vw;word-wrap:break-word;padding:0 8px}
#timer{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:clamp(22px,6vmin,40px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
#timer.low{color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
#score{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));font-weight:700;font-size:clamp(16px,4vmin,24px)}
#quit{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));
  background:rgba(0,0,0,.2);width:42px;height:42px;border-radius:50%;font-size:20px}
.taps{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;
  padding:0 max(14px,env(safe-area-inset-left))}
.tap{border-radius:14px;padding:12px 20px;font-weight:900;font-size:clamp(15px,4vmin,22px);background:rgba(0,0,0,.22)}
.tap.y{background:rgba(255,255,255,.22)}
.tap{position:relative;cursor:pointer}
.hap{position:absolute;inset:0;width:100%;height:100%;opacity:.01;margin:0;pointer-events:none}
#soundHint{display:none;position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.35);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;white-space:nowrap}
#soundHint.on{display:block}
#sensorState{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom) + 64px));left:0;right:0;font-size:13px;color:var(--muted)}
.rotate{display:none;position:fixed;inset:0;background:var(--bg2);z-index:20;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;text-align:center;padding:24px;font-size:22px;font-weight:700}
.rotate .ico{font-size:64px;animation:turn 1.6s infinite}
.rotate small{font-size:14px;color:var(--muted);font-weight:500}
@keyframes turn{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.playing .rotate.show{display:flex}}

/* Results */
#result{overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.res-head{text-align:center;margin:8px 0 14px}
.res-head .n{font-size:72px;font-weight:900;color:var(--gold);line-height:1}
.res-head .t{color:var(--muted);font-size:16px}
.list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-bottom:16px}
.list li{background:var(--card);border-radius:10px;padding:10px 12px;font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center}
.list li.s{opacity:.55;font-weight:500}
.list li .m{width:22px;text-align:center}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-bottom:20px}
.btn{background:var(--gold);color:#3a1a00;border-radius:14px;padding:14px 22px;font-weight:900;font-size:17px}
.btn.alt{background:var(--card);color:var(--ink)}
.note{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;margin-bottom:12px;display:none}
.note.on{display:block}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="top">
    <h1>Đoán <span>Chữ</span></h1>
    <span class="pills"><span id="lvl"></span> <button class="pill" id="langBtn">DE</button></span>
  </div>
  <p class="sub" data-t="tagline"></p>
  <div class="note" id="sensorNote"></div>
  <div class="row"><label data-t="time"></label><span id="times"></span></div>
  <div class="grid" id="cats"></div>
</section>

<section id="ready" class="screen">
  <div class="msg" data-t="forehead"></div>
  <div class="big" id="count">3</div>
  <div class="hint" id="pickedCat" style="font-size:clamp(20px,5vmin,32px);font-weight:700;color:var(--ink)"></div>
  <div class="hint" data-t="readyHint"></div>
</section>

<section id="play" class="screen">
  <button id="quit" aria-label="Quit">✕</button>
  <div id="timer">60</div>
  <div id="score">0</div>
  <div id="word"></div>
  <div id="sensorState"></div>
  <div id="soundHint" data-t="soundHint"></div>
  <div class="taps">
    <!-- label + verstecktes Schalter-Feld: der echte Fingertipp legt den Schalter um, das gibt am iPhone Haptik -->
    <label class="tap" id="tapSkip"><input type="checkbox" switch class="hap"><span></span></label>
    <label class="tap y" id="tapOk"><input type="checkbox" switch class="hap"><span></span></label>
  </div>
</section>

<section id="result" class="screen">
  <div class="res-head">
    <div class="t" data-t="timeUp"></div>
    <div class="n" id="resN">0</div>
    <div class="t" id="resT"></div>
  </div>
  <ul class="list" id="resList"></ul>
  <div class="btns">
    <button class="btn" id="again"></button>
    <button class="btn alt" id="toHome"></button>
  </div>
</section>

<div class="rotate" id="rotate"><div class="ico">📱</div><div data-t="rotate"></div><small data-t="rotateSmall"></small></div>

    // Bei einem Fingertipp dann einfach einen neuen anlegen, das klappt zuverlässig.
    if(ac && ac.state!=="running"){ try{ac.close()}catch(e){} ac=null }
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}
    if(ac.state!=="running")ac.resume();
  }catch(e){}
  updateSoundHint();
  if(typeof keepAwake==="function")keepAwake(true);
}
// Jeder Fingertipp irgendwo auf der Seite weckt den Ton wieder auf
document.addEventListener("touchend",unlockAudio,{capture:true,passive:true});
document.addEventListener("click",unlockAudio,{capture:true});
function updateSoundHint(){
  const h=document.getElementById("soundHint"); if(!h)return;
  h.classList.toggle("on", game.active && !!ac && ac.state!=="running");
}
// Zurück aus dem Sperrbildschirm: Ton versuchen fortzusetzen, Bildschirm wieder wach halten
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  try{ if(ac && ac.state!=="running") ac.resume().then(updateSoundHint,()=>{}) }catch(e){}
  keepAwake(true);
  setTimeout(updateSoundHint,600);
  // iOS stoppt den Bewegungssensor manchmal nach Pause/App-Wechsel: Zuhörer neu anmelden
  try{ if(listening){ window.removeEventListener("deviceorientation",onOrient); window.addEventListener("deviceorientation",onOrient) } }catch(e){}
});
function beep(freq,dur,type="sine",vol=.25,when=0){
  if(!ac)return; if(ac.state!=="running"){try{ac.resume()}catch(e){}}
  try{const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}}
// Richtig: helles „Ding-Ding“ nach oben. Überspringen: tiefes kurzes „Möp“ nach unten.
const sndOk=()=>{beep(784,.15,"triangle",.6);beep(1175,.3,"triangle",.6,.12)};
const sndSkip=()=>{beep(330,.15,"square",.3);beep(220,.3,"square",.3,.13)};
const sndTick=()=>beep(880,.06,"square",.08);
const sndEnd=()=>{beep(520,.25,"square",.15);beep(390,.25,"square",.15,.25);beep(260,.5,"square",.15,.5)};
// Vibration: Android kann navigator.vibrate. Safari am iPhone nicht; dort hilft ein Trick:
// Ein verstecktes Schalter-Feld (input type=checkbox switch, ab iOS 18) gibt beim Umschalten ein kurzes Haptik-Feedback.
let hapticEl=null;
function hapticTap(){
  try{
    if(!hapticEl){
      hapticEl=document.createElement("label");
      hapticEl.setAttribute("aria-hidden","true");
      hapticEl.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0";
      const inp=document.createElement("input"); inp.type="checkbox"; inp.setAttribute("switch","");
      hapticEl.appendChild(inp); document.body.appendChild(hapticEl);
    }
    hapticEl.click();
  }catch(e){}
}
function buzz(p){
  const pattern=Array.isArray(p)?p:[p];
  try{ if(navigator.vibrate && navigator.vibrate(pattern)) return }catch(e){}
  // iPhone: für jeden Puls ein Haptik-Tipp
  let t=0;
  pattern.forEach((d,i)=>{ if(i%2===0){ if(t===0) hapticTap(); else setTimeout(hapticTap,t); } t+=d; });
}

/* ---------- Startbildschirm ---------- */
function renderHome(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.innerHTML=T(el.dataset.t));
  $("langBtn").textContent = lang==="vi" ? "DE" : "VI";
  $("times").innerHTML=[60,90,120].map(s=>`<button class="seg${s===roundSec?" sel":""}" data-s="${s}">${s}s</button>`).join(" ");
  const rand={id:"rand",i:"🎯",vi:TXT.vi.rand,de:TXT.de.rand};
  $("lvl").innerHTML=`<button class="pill${level==="easy"?" sel":""}" data-l="easy">Dễ</button> <button class="pill${level==="hard"?" sel":""}" data-l="hard">OV</button>`;
  const all={id:"all",i:"🎲",vi:TXT.vi.all,de:TXT.de.all,w:[...new Set(CATS.flatMap(c=>c.w))]};
  $("cats").innerHTML=[all,rand,...CATS].map(c=>`<button class="cat" data-c="${c.id}"><i>${c.i}</i><b>${c[lang]}</b><small>${c.w?T("words")(c.w.length):T("randSub")}</small></button>`).join("");
  $("tapOk").querySelector("span").textContent=T("tapOk"); $("tapSkip").querySelector("span").textContent=T("tapSkip");
  $("again").textContent=T("again"); $("toHome").textContent=T("home");
}
$("langBtn").onclick=()=>{lang=lang==="vi"?"de":"vi";store.set("lang",lang);renderHome()};
$("times").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;roundSec=+b.dataset.s;store.set("sec",roundSec);renderHome()};
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b)startRound(b.dataset.c)};
$("lvl").onclick=e=>{const b=e.target.closest("[data-l]");if(!b||b.dataset.l===level)return;level=b.dataset.l;store.set("level",level);CATS=level==="easy"?CATS_EASY:CATS_HARD;for(const k in decks)delete decks[k];renderHome()};

/* ---------- Bewegungssensor ---------- */
// tilt = Anteil der Schwerkraft senkrecht zum Bildschirm:
// +1 Bildschirm zeigt zur Decke, 0 Handy steht senkrecht (an der Stirn), -1 Bildschirm zeigt zum Boden.
let sensor="unknown";   // unknown | on | denied | none
let tilt=null, lastEvt=0;
// Winkel in Grad relativ zur eigenen Haltung (wird beim Rundenstart gemessen und langsam nachgeführt).
// Nach oben kippen fällt mit dem Kopf schwerer, daher dort eine kleinere Schwelle.
const DEG_DOWN=30;      // so weit nach unten -> richtig
const DEG_UP=20;        // so weit nach oben  -> überspringen
const DEG_NEUTRAL=12;   // zurück in diesen Bereich -> nächster Kipp erlaubt
let base=0;
const angle=()=>Math.asin(Math.max(-1,Math.min(1,tilt)))*180/Math.PI;
const rel=()=>angle()-base;
function calibrate(){ base = (tilt!=null && Math.abs(angle())<25) ? angle() : 0 }
function onOrient(e){
  if(e.beta==null||e.gamma==null)return;
  const r=Math.PI/180;
  tilt=Math.cos(e.beta*r)*Math.cos(e.gamma*r);
  lastEvt=performance.now();
  if(sensor!=="on"){sensor="on";updateSensorUI()}
  if(game.active)checkTilt();
}
let listening=false;
async function enableSensor(){
  // muss direkt aus einem Fingertipp kommen (iOS)
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const res=await DeviceOrientationEvent.requestPermission();
      if(res!=="granted"){sensor="denied";updateSensorUI();return}
    }
    if(!listening){window.addEventListener("deviceorientation",onOrient);listening=true}
    setTimeout(()=>{if(sensor!=="on"){sensor="none";updateSensorUI()}},1500);
  }catch(err){sensor="denied";updateSensorUI()}
}
function updateSensorUI(){
  const n=$("sensorNote");
  if(sensor==="denied"){n.innerHTML=T("denied");n.classList.add("on")}
  else if(sensor==="none"){n.innerHTML=T("noSensor");n.classList.add("on")}
  else n.classList.remove("on");
  $("sensorState").textContent = sensor==="on"?T("sensorOn"):(sensor==="unknown"?"":T("sensorOff"));
}

/* ---------- Spiel ---------- */
const decks={};
const game={active:false,cat:null,words:[],idx:0,results:[],end:0,armed:false,lock:false,raf:0,lastSec:-1,cdTimer:0};
function nextWord(){
  const id=game.cat;
  if(!decks[id]||!decks[id].length){
    const src=id==="all"?[...new Set(CATS.flatMap(c=>c.w))]:CATS.find(c=>c.id===id).w;
    decks[id]=shuffle(src);
  }
  game.current=decks[id].pop();
  const w=$("word"); w.textContent=game.current; fitWord();
}
function fitWord(){
  const w=$("word"); if(!w.textContent)return;
  const maxW=innerWidth*0.92, maxH=innerHeight*0.55;
  let size=Math.min(innerWidth,innerHeight)*0.42;
  w.style.fontSize=size+"px";
  for(let k=0;k<30&&(w.scrollWidth>maxW||w.scrollHeight>maxH);k++){size*=0.9;w.style.fontSize=size+"px"}
}
addEventListener("resize",()=>{if(game.active)fitWord()});

let wakeLock=null;
// Bildschirm wach halten, solange das Spiel offen ist (auch zwischen den Runden).
// iOS gibt die Sperre beim Bildschirm-Aus oder App-Wechsel frei; dann bei Rückkehr/Tipp neu holen.
async function keepAwake(on){
  if(!on)return;   // absichtlich nie freigeben, solange die Seite sichtbar ist
  try{
    if(!("wakeLock" in navigator)||document.visibilityState!=="visible")return;
    if(wakeLock && !wakeLock.released)return;
    wakeLock=await navigator.wakeLock.request("screen");
  }catch(e){}
}

async function startRound(catId){
  game.rand=(catId==="rand");
  if(game.rand){const c=CATS[Math.floor(Math.random()*CATS.length)];catId=c.id;$("pickedCat").textContent="🎯 "+c[lang]}else $("pickedCat").textContent="";
  unlockAudio();
  if(sensor!=="on")enableSensor();   // im selben Fingertipp starten (iOS-Pflicht)
  game.cat=catId; game.results=[]; game.active=false;
  document.body.classList.add("playing"); $("rotate").classList.add("show");
  keepAwake(true);
  show("ready");
  let n=3; $("count").textContent=n;
  clearInterval(game.cdTimer);
  game.cdTimer=setInterval(()=>{
    n--; if(n>0){$("count").textContent=n;sndTick()}
    else{clearInterval(game.cdTimer);beginPlay()}
  },1000);
}
function beginPlay(){
  show("play"); $("play").className="screen on";
  $("rotate").classList.remove("show");
  game.active=true; game.lock=false;
  calibrate(); game.armed = true; stillRef=null; lastEvt=performance.now();
  game.end=performance.now()+roundSec*1000; game.lastSec=-1;
  $("score").textContent="0"; $("timer").classList.remove("low");
  updateSensorUI(); nextWord(); beep(990,.2,"triangle");
  cancelAnimationFrame(game.raf); tick();
}
function tick(){
  if(!game.active)return;
  const left=Math.max(0,game.end-performance.now()), s=Math.ceil(left/1000);
  if(s!==game.lastSec){
    game.lastSec=s; $("timer").textContent=s;
    if(s<=5&&s>0){$("timer").classList.add("low");sndTick()}
  }
  if(left<=0){finish();return}
  // Auch ohne neues Sensor-Ereignis prüfen (iPhone meldet bei ruhiger Haltung kaum etwas)
  if(sensor==="on"&&tilt!=null)checkTilt();
  // Kommt länger kein Sensorwert mehr (iOS pausiert ihn manchmal mitten in der Runde): Zuhörer neu anmelden
  const nowT=performance.now();
  if(sensor==="on"&&listening&&nowT-lastEvt>2000&&nowT-lastResub>2000){
    lastResub=nowT;
    try{window.removeEventListener("deviceorientation",onOrient);window.addEventListener("deviceorientation",onOrient)}catch(e){}
  }
  game.raf=requestAnimationFrame(tick);
}
let stillRef=null, stillSince=0, lastResub=0;
function checkTilt(){
  if(game.lock)return;
  const r=rel();
  if(Math.abs(r)<DEG_NEUTRAL){
    // Haltung langsam nachführen, falls man den Kopf etwas anders hält
    base=Math.max(-25,Math.min(25,base+r*0.03));
    game.armed=true; stillRef=null; return;
  }
  if(!game.armed){
    // Festgefahren? Wer das Handy ruhig in einer neuen Haltung hält (außerhalb der Mitte),
    // bekommt nach 0,7 s diese Haltung als neue Mitte, sonst reagiert das Kippen nicht mehr.
    const now=performance.now();
    if(stillRef===null||Math.abs(r-stillRef)>4){stillRef=r;stillSince=now}
    else if(now-stillSince>700&&Math.abs(r)<=25){base=Math.max(-25,Math.min(25,base+r));game.armed=true;stillRef=null}
    return;
  }
  stillRef=null;
  if(r<-DEG_DOWN)answer(true);        // Bildschirm zum Boden = richtig
  else if(r>DEG_UP)answer(false);     // Bildschirm zur Decke = überspringen
}
function answer(ok){
  if(!game.active||game.lock)return;
  game.lock=true; game.armed=false; stillRef=null;    // Sperre gegen Doppelzählung
  game.results.push({w:game.current,ok});
  $("score").textContent=game.results.filter(r=>r.ok).length;
  $("play").classList.add(ok?"ok":"skip");
  $("word").textContent=ok?T("ok"):T("skip"); fitWord();
  ok?(sndOk(),buzz(80)):(sndSkip(),buzz([40,40,40]));
  setTimeout(()=>{
    if(!game.active)return;
    $("play").classList.remove("ok","skip");
    nextWord(); game.lock=false;
    // Ohne Sensor (oder Knopf) sofort wieder bereit; mit Sensor erst zurück in die Mitte
    if(sensor!=="on"||tilt==null||Math.abs(rel())<DEG_NEUTRAL)game.armed=true;
  },800);
}
// Ein Tipp aufs label löst zusätzlich einen Klick auf das Schalter-Feld aus; den ignorieren, sonst zählt es doppelt.
$("tapOk").onclick=e=>{e.stopPropagation();if(e.target.tagName==="INPUT")return;unlockAudio();answer(true,true)};
$("tapSkip").onclick=e=>{e.stopPropagation();if(e.target.tagName==="INPUT")return;unlockAudio();answer(false,true)};
$("quit").onclick=()=>{stopGame();showHome()};

function stopGame(){
  game.active=false; clearInterval(game.cdTimer); cancelAnimationFrame(game.raf);
  document.body.classList.remove("playing"); $("rotate").classList.remove("show"); keepAwake(false);
}
function finish(){
  if(game.current && !game.lock) game.results.push({w:game.current,ok:false,last:true});
  stopGame(); sndEnd(); buzz([200,100,200]);
  const ok=game.results.filter(r=>r.ok).length;
  $("resN").textContent=ok;
  $("resT").textContent=T("correctOf")(ok,game.results.length);
  $("resList").innerHTML=game.results.map(r=>`<li class="${r.ok?"":"s"}"><span class="m">${r.ok?"✅":"⏭️"}</span>${esc(r.w)}</li>`).join("");
  renderHome(); show("result"); $("result").scrollTop=0;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
$("again").onclick=()=>startRound(game.rand?"rand":game.cat);
$("toHome").onclick=showHome;
function showHome(){renderHome();updateSensorUI();show("home")}

renderHome();
// Offline spielen: Dateien im Handy speichern (Service Worker)
if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
